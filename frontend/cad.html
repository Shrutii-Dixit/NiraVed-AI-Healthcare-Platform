<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NiraVed - CAD Risk</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <div><strong data-i18n="title">NiraVed</strong></div>
  <div>
    <a href="index.html" data-i18n="home">Home</a>
    <a href="heart.html" data-i18n="heart">Heart Risk</a>
    <a href="stroke.html" data-i18n="stroke">Stroke Risk</a>
    <a href="cad.html" data-i18n="cad">CAD Risk</a>
    <a href="about.html" data-i18n="about">About</a>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">हिंदी</button>
  </div>
</nav>
<div class="container">
  <div class="card">
    <h2>🫀 <span data-i18n="cad">CAD Risk</span></h2>
    <p>Fill in the clinical details below (Z-Alizadeh Sani features).</p>
    <div id="form" class="row"></div>
    <button class="btn" onclick="predict()" data-i18n="predict">Predict Risk</button>
    <div id="res" class="res"></div>
  </div>
  <p class="disclaimer" data-i18n="disclaimer"></p>
</div>
<footer>NiraVed — B.Tech mini project · MIT License</footer>
<script src="i18n.js"></script>
<script>
const API="https://niraved-backend.onrender.com";
let features=[];
async function init(){
  const r=await fetch(API+"/meta/cad"); const d=await r.json(); features=d.features;
  const form=document.getElementById("form");
  features.forEach(f=>{
    const lab=document.createElement("label"); lab.textContent=f;
    const inp=document.createElement("input"); inp.id="f_"+f; inp.type="text";
    lab.appendChild(inp); form.appendChild(lab);
  });
}
async function predict(){
  const body={}; features.forEach(f=>{const v=document.getElementById("f_"+f).value; body[f]=v===""?null:v;});
  const r=await fetch(API+"/predict/cad",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json(); document.getElementById("res").textContent=`${t("risk_prob")}: ${(d.risk_probability*100).toFixed(1)}%  (${t(d.risk_label)})`;
}
init();
</script>
</body>
</html>
