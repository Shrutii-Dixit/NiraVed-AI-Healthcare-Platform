<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NiraVed - Heart Risk</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <div><strong data-i18n="title">NiraVed</strong></div>
  <div>
    <a href="index.html" data-i18n="home">Home</a>
    <a href="heart.html" data-i18n="heart">Heart Risk</a>
    <a href="stroke.html" data-i18n="stroke">Stroke Risk</a>
    <a href="cad.html" data-i18n="cad">CAD Risk</a>
    <a href="about.html" data-i18n="about">About</a>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">हिंदी</button>
  </div>
</nav>
<div class="container">
  <div class="card">
    <h2>❤️ <span data-i18n="heart">Heart Risk</span></h2>
    <div class="row">
      <label>Age<input id="age" type="number" value="52"></label>
      <label>Sex (1=M,0=F)<input id="sex" type="number" value="1"></label>
      <label>Chest pain (0-3)<input id="cp" type="number" value="0"></label>
      <label>Rest BP<input id="trestbps" type="number" value="125"></label>
      <label>Chol<input id="chol" type="number" value="212"></label>
      <label>FBS>120<input id="fbs" type="number" value="0"></label>
      <label>Rest ECG<input id="restecg" type="number" value="1"></label>
      <label>Max HR<input id="thalach" type="number" value="168"></label>
      <label>Ex angina<input id="exang" type="number" value="0"></label>
      <label>Oldpeak<input id="oldpeak" type="number" step="0.1" value="1.0"></label>
      <label>Slope<input id="slope" type="number" value="2"></label>
      <label>CA<input id="ca" type="number" value="0"></label>
      <label>Thal<input id="thal" type="number" value="3"></label>
    </div>
    <button class="btn" onclick="predict()" data-i18n="predict">Predict Risk</button>
    <div id="res" class="res"></div>
  </div>
  <p class="disclaimer" data-i18n="disclaimer"></p>
</div>
<script src="i18n.js"></script>
<script>
const API="http://127.0.0.1:8000";
async function predict(){
  const body={age:+age.value,sex:+sex.value,cp:+cp.value,trestbps:+trestbps.value,chol:+chol.value,
    fbs:+fbs.value,restecg:+restecg.value,thalach:+thalach.value,exang:+exang.value,
    oldpeak:+oldpeak.value,slope:+slope.value,ca:+ca.value,thal:+thal.value};
  const r=await fetch(API+"/predict/heart",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  res.textContent=`${t("risk_prob")}: ${(d.risk_probability*100).toFixed(1)}%  (${t(d.risk_label)})`;
}
</script>
</body>
</html>
