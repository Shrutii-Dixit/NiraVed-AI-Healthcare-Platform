<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NiraVed - Stroke Risk</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <div><strong data-i18n="title">NiraVed</strong></div>
  <div>
    <a href="index.html" data-i18n="home">Home</a>
    <a href="heart.html" data-i18n="heart">Heart Risk</a>
    <a href="stroke.html" data-i18n="stroke">Stroke Risk</a>
    <a href="cad.html" data-i18n="cad">CAD Risk</a>
    <a href="about.html" data-i18n="about">About</a>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">हिंदी</button>
  </div>
</nav>
<div class="container">
  <div class="card">
    <h2>🧠 <span data-i18n="stroke">Stroke Risk</span></h2>
    <div class="row">
      <label>Gender<select id="gender"><option>Male</option><option>Female</option></select></label>
      <label>Age<input id="age" type="number" value="67"></label>
      <label>Hypertension<input id="hypertension" type="number" value="0"></label>
      <label>Heart disease<input id="heart_disease" type="number" value="1"></label>
      <label>Ever married<select id="ever_married"><option>Yes</option><option>No</option></select></label>
      <label>Work type<select id="work_type"><option>Private</option><option>Self-employed</option><option>Govt_job</option><option>children</option><option>Never_worked</option></select></label>
      <label>Residence<select id="Residence_type"><option>Urban</option><option>Rural</option></select></label>
      <label>Avg glucose<input id="avg_glucose_level" type="number" step="0.1" value="228.69"></label>
      <label>BMI<input id="bmi" type="number" step="0.1" value="36.6"></label>
      <label>Smoking<select id="smoking_status"><option>formerly smoked</option><option>never smoked</option><option>smokes</option><option>Unknown</option></select></label>
    </div>
    <button class="btn" onclick="predict()" data-i18n="predict">Predict Risk</button>
    <div id="res" class="res"></div>
  </div>
  <p class="disclaimer" data-i18n="disclaimer"></p>
</div>
<script src="i18n.js"></script>
<script>
const API="http://127.0.0.1:8000";
async function predict(){
  const body={gender:gender.value,age:+age.value,hypertension:+hypertension.value,heart_disease:+heart_disease.value,
    ever_married:ever_married.value,work_type:work_type.value,Residence_type:Residence_type.value,
    avg_glucose_level:+avg_glucose_level.value,bmi:+bmi.value,smoking_status:smoking_status.value};
  const r=await fetch(API+"/predict/stroke",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  res.textContent=`${t("risk_prob")}: ${(d.risk_probability*100).toFixed(1)}%  (${t(d.risk_label)})`;
}
</script>
</body>
</html>
